services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    volumes:
      - ./testpack:/app/testpack:ro
      - ./audio:/app/audio
      - ./evals:/app/evals
      - model-cache:/cache
volumes:
  model-cache:
