services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      LLM_CACHE: ${LLM_CACHE:-replay}   # eval harness only; the app always calls live
    volumes:
      - ./testpack:/app/testpack:ro
      - ./audio:/app/audio
      - ./evals:/app/evals
      - ./README.md:/app/README.md
      - model-cache:/cache
      # replays cached LLM responses + decoded audio between runs (gitignored)
      - ./.cache:/app/.cache
      - ./evals/substitutes:/app/evals/substitutes
volumes:
  model-cache:
